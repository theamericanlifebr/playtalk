<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <title>Usuários | PlayTalk Admin</title>
  <meta
    name="description"
    content="Administração de usuários PlayTalk"
  >
  <link rel="icon" type="image/svg+xml" href="SVG/logo.svg">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/settings.js"></script>
  <script src="js/lens.js"></script>
  <script src="js/auth.js"></script>
</head>
<body class="page-users-admin" data-lens-context="menus">
  <header class="site-header" id="global-header">
    <div class="site-header__profile">
      <div class="site-header__avatar-container" id="header-avatar-container">
        <div class="site-header__avatar-ring">
          <img
            src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2296%22%20height%3D%2296%22%20viewBox%3D%220%200%2096%2096%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23c5d7ff%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%237fa8ff%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle%20cx%3D%2248%22%20cy%3D%2248%22%20r%3D%2248%22%20fill%3D%22url(%23g)%22/%3E%3Cpath%20fill%3D%22%23fff%22%20opacity%3D%220.85%22%20d%3D%22M48%2046a14%2014%200%201%200-14-14A14%2014%200%200%200%2048%2046Zm0%207c-12.1%200-22%206.56-22%2014.66V70a24%2024%200%200%200%2044%200v-2.34C70%2059.56%2060.1%2053%2048%2053Z%22/%3E%3C/svg%3E"
            alt="Foto do usuário"
            class="site-header__avatar"
            id="header-avatar"
          >
        </div>
      </div>
      <div class="site-header__text">
        <span class="site-header__name" id="header-username">Jogador</span>
        <span class="site-header__level" id="header-level">Nível 1</span>
      </div>
    </div>
    <div class="site-header__actions">
      <button id="login-btn" class="site-header__button" type="button">Entrar</button>
    </div>
  </header>

  <main class="container-screen container-screen--usersadmin" data-page-transition>
    <section class="users-admin">
      <header class="users-admin__header">
        <div>
          <h1>Usuários cadastrados</h1>
          <p>Gerencie níveis, confira o tempo total de jogo e organize a base de usuários.</p>
        </div>
        <label class="users-admin__search">
          <span class="sr-only">Pesquisar usuário</span>
          <input type="search" placeholder="Pesquisar usuário" data-users-search>
        </label>
      </header>

      <p class="users-admin__status" data-users-status role="status">Carregando usuários...</p>
      <div class="users-admin__grid" data-users-grid></div>
    </section>
  </main>

  <div class="users-admin__modal" data-users-modal hidden>
    <div class="users-admin__modal-overlay" data-users-modal-close></div>
    <div class="users-admin__modal-card" role="dialog" aria-modal="true" aria-labelledby="users-admin-modal-title">
      <header class="users-admin__modal-header">
        <div class="users-admin__modal-profile">
          <img class="users-admin__modal-avatar" data-modal-avatar alt="Foto do usuário">
          <div>
            <h2 id="users-admin-modal-title" data-modal-name>Usuário</h2>
            <p class="users-admin__modal-level" data-modal-level>Nível 1</p>
          </div>
        </div>
        <button class="users-admin__modal-close" type="button" data-users-modal-close aria-label="Fechar">×</button>
      </header>

      <div class="users-admin__modal-body">
        <div class="users-admin__metric">
          <span>Tempo total de jogo</span>
          <strong data-modal-time>0 min</strong>
        </div>
        <div class="users-admin__metric">
          <span>Nível atual</span>
          <strong data-modal-level-value>1</strong>
        </div>

        <form class="users-admin__form" data-level-form>
          <label>
            Novo nível
            <input type="number" min="1" max="999" step="1" required data-level-input>
          </label>
          <button type="submit" class="button-primary">Atualizar nível</button>
        </form>

        <button class="button-danger" type="button" data-delete-user>Excluir usuário</button>
        <p class="users-admin__message" data-modal-message></p>
      </div>
    </div>
  </div>

  <script src="js/usersadmin.js"></script>
</body>
</html>
