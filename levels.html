<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayTalk | Níveis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c1222;
      --card: #121a2e;
      --accent: #3f8cff;
      --accent-soft: #2a3a5c;
      --text: #e7ecf5;
      --muted: #9eafc7;
      --border: #1f2a44;
      --success: #2dc98a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: radial-gradient(circle at 20% 20%, rgba(63, 140, 255, 0.16), transparent 30%),
                  radial-gradient(circle at 80% 0%, rgba(119, 77, 255, 0.12), transparent 30%),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .page {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 20px 64px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .pill {
      background: var(--accent-soft);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 14px;
      font-weight: 600;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .controls {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
      flex-wrap: wrap;
    }

    .controls button {
      border: 1px solid var(--border);
      background: var(--accent-soft);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.2s ease;
    }

    .controls button:hover { box-shadow: 0 10px 30px rgba(63, 140, 255, 0.22); }
    .controls button:active { transform: translateY(1px); }

    main { margin-top: 20px; }

    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    .image-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.22);
      position: relative;
      overflow: hidden;
      min-height: 220px;
    }

    .level-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(63, 140, 255, 0.14);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 12px;
    }

    .image-card img, .image-placeholder {
      width: 140px;
      height: 140px;
      object-fit: cover;
      display: block;
      filter: drop-shadow(0 10px 16px rgba(0, 0, 0, 0.25));
      border-radius: 50%;
      background: #0f1526;
      border: 1px dashed var(--border);
      cursor: pointer;
      overflow: hidden;
    }

    .image-placeholder {
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      padding: 8px;
    }

    .label-btn {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--accent-soft);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      text-transform: none;
      text-align: center;
    }

    .label-btn--pt { background: linear-gradient(90deg, rgba(63, 140, 255, 0.4), rgba(63, 140, 255, 0.2)); }
    .label-btn--en { background: #0f1526; color: var(--muted); }
    .label-btn--folder { background: #0f1526; color: var(--text); border-style: dashed; }

    .hint { color: var(--muted); font-size: 13px; margin-top: 4px; }

    .loading { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 15px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; animation: pulse 1.1s ease-in-out infinite; }
    .dot:nth-child(2) { animation-delay: 0.15s; }
    .dot:nth-child(3) { animation-delay: 0.3s; }
    @keyframes pulse { 0%, 80%, 100% { transform: scale(0.7); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 10;
    }

    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.28);
    }

    .modal h3 { margin: 0 0 10px; }
    .modal p { margin: 0 0 12px; color: var(--muted); }

    .modal .field { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
    .modal select { flex: 1; background: #0f1526; color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
    .modal .actions { display: flex; gap: 8px; justify-content: flex-end; }
    .modal button { border: 1px solid var(--border); background: var(--accent-soft); color: var(--text); padding: 10px 12px; border-radius: 10px; font-weight: 700; cursor: pointer; }

    .controls__level-filter {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .controls__level-filter label { color: var(--muted); font-size: 14px; }

    .controls__level-filter select {
      background: #0f1526;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      font-weight: 600;
    }

    .empty-state { margin-top: 24px; text-align: center; color: var(--muted); border: 1px dashed var(--border); border-radius: 12px; padding: 18px; display: none; }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div>
        <h1>Edição de níveis pessoais</h1>
        <p>Suas alterações ficam apenas no seu navegador (localStorage).</p>
      </div>
      <div class="pill" id="loading-indicator">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span>Carregando</span>
      </div>
    </header>

    <div class="controls">
      <button id="new-grid-btn">Nova grade</button>
      <button id="upload-btn">Upload de imagens</button>
      <button id="export-json-btn">Exportar JSON</button>
      <button id="export-images-btn">Exportar imagens</button>
      <div class="controls__level-filter">
        <label for="level-filter">Nível</label>
        <select id="level-filter"></select>
      </div>
      <span class="hint">Dê dois toques nos botões para editar textos ou imagens.</span>
    </div>

    <main>
      <div id="image-grid" class="image-grid"></div>
      <div id="empty-state" class="empty-state">Nenhuma imagem encontrada para este nível.</div>
    </main>
  </div>

  <div class="modal-backdrop" id="image-modal">
    <div class="modal">
      <h3>Gerenciar imagem</h3>
      <p>Envie um arquivo novo ou mova a imagem para outro nível.</p>
      <div class="field">
        <label for="move-select">Mover para o nível</label>
        <select id="move-select"></select>
      </div>
      <div class="actions" style="justify-content: space-between;">
        <div>
          <label for="change-image-input" class="label-btn" style="padding: 8px 12px; display: inline-flex; align-items: center; gap: 8px;">Enviar arquivo</label>
          <input id="change-image-input" type="file" accept="image/png,image/jpeg,image/jpg,image/webp,image/gif,image/svg+xml" style="display:none" />
        </div>
        <div class="actions">
          <button id="remove-image-btn">Remover foto</button>
          <button id="copy-image-btn">Mover</button>
          <button id="close-modal-btn">Fechar</button>
        </div>
      </div>
    </div>
  </div>

  <input id="upload-input" type="file" accept="image/png,image/jpeg,image/jpg,image/webp,image/gif,image/svg+xml" multiple style="display:none" />

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script>
    const STORAGE_KEY = 'playtalk-levels-editor-v1';
    const MAX_LEVELS = 100;
    const grid = document.getElementById('image-grid');
    const emptyState = document.getElementById('empty-state');
    const loadingIndicator = document.getElementById('loading-indicator');
    const uploadInput = document.getElementById('upload-input');
    const changeImageInput = document.getElementById('change-image-input');
    const newGridBtn = document.getElementById('new-grid-btn');
    const uploadBtn = document.getElementById('upload-btn');
    const exportJsonBtn = document.getElementById('export-json-btn');
    const exportImagesBtn = document.getElementById('export-images-btn');
    const imageModal = document.getElementById('image-modal');
    const moveSelect = document.getElementById('move-select');
    const moveBtn = document.getElementById('copy-image-btn');
    const removeBtn = document.getElementById('remove-image-btn');
    const closeModalBtn = document.getElementById('close-modal-btn');
    const levelFilter = document.getElementById('level-filter');

    let levels = [];
    let imageCache = new Map();
    let activeLevelIndex = null;
    let selectedLevelFilter = 'all';

    const allowedTypes = ['image/png', 'image/jpeg', 'image/jpg', 'image/webp', 'image/gif', 'image/svg+xml'];

    const resolveLevelNumber = (level, index) => {
      const value = Number(level.folderIndex);
      if (Number.isInteger(value) && value > 0) return value;
      return index + 1;
    };

    const buildLevelFilter = () => {
      const numericSelected = Number(selectedLevelFilter);
      if (selectedLevelFilter !== 'all' && (!Number.isInteger(numericSelected) || numericSelected < 1 || numericSelected > MAX_LEVELS)) {
        selectedLevelFilter = 'all';
      }

      levelFilter.innerHTML = '';
      const allOption = document.createElement('option');
      allOption.value = 'all';
      allOption.textContent = 'Todos';
      levelFilter.appendChild(allOption);

      for (let levelNumber = 1; levelNumber <= MAX_LEVELS; levelNumber += 1) {
        const option = document.createElement('option');
        option.value = String(levelNumber);
        option.textContent = `Nível ${levelNumber}`;
        levelFilter.appendChild(option);
      }

      levelFilter.value = selectedLevelFilter;
    };

    const toggleLoading = (show) => {
      loadingIndicator.style.display = show ? 'inline-flex' : 'none';
    };

    const defaultLevel = () => ({
      pt: '',
      en: '',
      folder: '',
      folderIndex: 1,
      file: '',
      dataUrl: '',
      format: ''
    });

    const saveState = () => {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ levels }));
      } catch (err) {
        console.error('Erro ao salvar localmente', err);
      }
    };

    const loadState = () => {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (!stored) return null;
        const parsed = JSON.parse(stored);
        if (Array.isArray(parsed?.levels)) {
          return parsed.levels.map((level, idx) => ({ ...defaultLevel(), ...level, order: idx + 1 })).slice(0, MAX_LEVELS);
        }
      } catch (err) {
        console.warn('Estado local inválido', err);
      }
      return null;
    };

    const normalizeLevelNumber = (value) => {
      const numeric = Number(value);
      return Number.isFinite(numeric) ? numeric : null;
    };

    const fetchDefaults = async () => {
      try {
        const [imageResponse, levelsResponse] = await Promise.all([
          fetch('images/images.json'),
          fetch('/api/image-levels')
        ]);

        if (!imageResponse.ok || !levelsResponse.ok) {
          throw new Error('Não foi possível carregar os dados de imagem.');
        }

        const imageData = await imageResponse.json();
        const levelData = await levelsResponse.json();
        const levelMap = new Map(
          Object.entries((levelData && levelData.levels) || {})
            .map(([file, level]) => [file, normalizeLevelNumber(level)])
        );

        const orderedImages = Array.isArray(imageData) ? imageData.slice(0, MAX_LEVELS) : [];
        const base = orderedImages.map((item, idx) => {
          const fileName = item.file || item.imagem || '';
          const levelNumber = normalizeLevelNumber(levelMap.get(fileName));
          const targetIndex = Number.isInteger(levelNumber) && levelNumber >= 1 ? levelNumber - 1 : idx;

          return {
            ...defaultLevel(),
            order: targetIndex + 1,
            pt: item.pt || item.nomePortugues || '',
            en: item.en || item.nomeIngles || '',
            folder: item.folder || item.categoria || '',
            folderIndex: targetIndex + 1,
            file: fileName,
            dataUrl: '',
            format: (fileName || '').split('.').pop() || 'webp'
          };
        });

        return base;
      } catch (error) {
        console.error('Erro ao carregar dados padrão:', error);
        return [];
      }
    };

    const renderButtons = (level, index, card) => {
      const levelNumber = resolveLevelNumber(level, index);
      const fields = [
        { key: 'pt', label: 'Português', className: 'label-btn--pt' },
        { key: 'en', label: 'English', className: 'label-btn--en' },
        { key: 'folder', label: 'Folder', className: 'label-btn--folder' }
      ];

      fields.forEach(field => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `label-btn ${field.className}`;
        button.textContent = level[field.key] || '';
        button.title = 'Dê dois cliques para editar';
        button.addEventListener('dblclick', () => {
          const value = prompt(`Digite o ${field.label} do nível ${levelNumber}`, level[field.key] || '');
          if (value === null) return;
          levels[index][field.key] = value.trim();
          saveState();
          renderGrid();
        });
        card.appendChild(button);
      });
    };

    const getImageSource = (level) => {
      if (level.dataUrl) return level.dataUrl;
      if (level.file) return `images/${level.file}`;
      return null;
    };

    const renderGrid = () => {
      grid.innerHTML = '';
      const fragment = document.createDocumentFragment();
      let renderedCount = 0;

      levels.forEach((level, index) => {
        const levelNumber = resolveLevelNumber(level, index);
        if (selectedLevelFilter !== 'all' && Number(selectedLevelFilter) !== levelNumber) return;

        const card = document.createElement('div');
        card.className = 'image-card';

        const badge = document.createElement('div');
        badge.className = 'level-badge';
        badge.textContent = `Nível ${levelNumber}`;
        card.appendChild(badge);

        const src = getImageSource(level);
        if (src) {
          const img = document.createElement('img');
          img.src = src;
          img.alt = level.pt || level.en || `Nível ${levelNumber}`;
          img.loading = 'lazy';
          img.addEventListener('dblclick', () => openImageModal(index));
          card.appendChild(img);
        } else {
          const placeholder = document.createElement('div');
          placeholder.className = 'image-placeholder';
          placeholder.textContent = 'Duplo clique para adicionar imagem';
          placeholder.addEventListener('dblclick', () => openImageModal(index));
          card.appendChild(placeholder);
        }

        renderButtons(level, index, card);
        fragment.appendChild(card);
        renderedCount += 1;
      });

      grid.appendChild(fragment);
      emptyState.style.display = renderedCount > 0 ? 'none' : 'block';
    };

    const sanitizeFileName = (name, extension) => {
      const base = name.replace(/\.[^.]+$/, '').toLowerCase().replace(/[^a-z0-9_-]+/g, '-');
      const suffix = Date.now();
      return `${base || 'imagem'}-${suffix}.${extension}`;
    };

    const readFileAsDataUrl = (file) => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });

    const readFileAsText = (file) => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsText(file);
    });

    const resizeImage = (img, type = 'image/webp') => {
      const canvas = document.createElement('canvas');
      canvas.width = 600;
      canvas.height = 600;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 600, 600);

      const scale = Math.max(600 / img.width, 600 / img.height);
      const width = img.width * scale;
      const height = img.height * scale;
      const offsetX = (600 - width) / 2;
      const offsetY = (600 - height) / 2;
      ctx.drawImage(img, offsetX, offsetY, width, height);
      return canvas.toDataURL(type, 0.82);
    };

    const processSvg = async (file) => {
      const text = await readFileAsText(file);
      const sized = text.replace(/(width|height)="[^"]*"/g, '')
        .replace('<svg', '<svg width="600" height="600"');
      const blob = new Blob([sized], { type: 'image/svg+xml' });
      const dataUrl = await readFileAsDataUrl(blob);
      return { dataUrl, format: 'svg', fileName: sanitizeFileName(file.name, 'svg') };
    };

    const processRaster = async (file, keepWebp) => {
      const dataUrl = await readFileAsDataUrl(file);
      const img = new Image();
      img.src = dataUrl;
      await img.decode();
      const outputType = keepWebp ? 'image/webp' : 'image/webp';
      const resized = resizeImage(img, outputType);
      const extension = keepWebp ? 'webp' : 'webp';
      return { dataUrl: resized, format: extension, fileName: sanitizeFileName(file.name, extension) };
    };

    const handleFileProcessing = async (file) => {
      if (!allowedTypes.includes(file.type)) {
        throw new Error(`Formato não suportado: ${file.type}`);
      }

      const ext = (file.name.split('.').pop() || '').toLowerCase();
      if (ext === 'svg' || file.type === 'image/svg+xml') {
        return processSvg(file);
      }

      const keepWebp = ext === 'webp' || file.type === 'image/webp';
      return processRaster(file, keepWebp);
    };

    const assignImageToLevel = (index, processed) => {
      const existingLevel = levels[index] || defaultLevel();
      const targetLevel = Number(existingLevel.folderIndex) || 1;
      levels[index] = {
        ...existingLevel,
        file: processed.fileName,
        dataUrl: processed.dataUrl,
        format: processed.format,
        folderIndex: targetLevel,
      };
    };

    const handleUpload = async (fileList) => {
      const availableSlots = MAX_LEVELS - levels.length;
      if (availableSlots <= 0) return;

      const files = Array.from(fileList).slice(0, availableSlots);
      let targetIndex = levels.length;

      for (const file of files) {
        try {
          const processed = await handleFileProcessing(file);
          assignImageToLevel(targetIndex, processed);
          levels[targetIndex].pt = '';
          levels[targetIndex].en = '';
          levels[targetIndex].folder = '';
          levels[targetIndex].folderIndex = 1;
          targetIndex += 1;
        } catch (error) {
          console.error('Erro ao processar arquivo', error);
        }
      }

      saveState();
      buildLevelFilter();
      renderGrid();
    };

    const openImageModal = (index) => {
      activeLevelIndex = index;
      moveSelect.innerHTML = '';
      const currentLevel = resolveLevelNumber(levels[index] || {}, index);
      for (let i = 1; i <= MAX_LEVELS; i++) {
        const option = document.createElement('option');
        option.value = i;
        option.textContent = `Nível ${i}`;
        moveSelect.appendChild(option);
      }
      moveSelect.value = currentLevel;
      imageModal.style.display = 'flex';
    };

    const closeModal = () => {
      imageModal.style.display = 'none';
      activeLevelIndex = null;
      changeImageInput.value = '';
    };

    moveBtn.addEventListener('click', () => {
      if (activeLevelIndex === null) return;
      const to = Number(moveSelect.value);
      if (!Number.isInteger(to) || to <= 0 || to > MAX_LEVELS) return;
      levels[activeLevelIndex] = {
        ...levels[activeLevelIndex],
        folderIndex: to
      };
      saveState();
      renderGrid();
      closeModal();
    });

    removeBtn.addEventListener('click', () => {
      if (activeLevelIndex === null) return;
      levels[activeLevelIndex] = defaultLevel(activeLevelIndex + 1);
      saveState();
      renderGrid();
      closeModal();
    });

    closeModalBtn.addEventListener('click', closeModal);

    changeImageInput.addEventListener('change', async (event) => {
      if (activeLevelIndex === null) return;
      const file = event.target.files?.[0];
      if (!file) return;
      try {
        const processed = await handleFileProcessing(file);
        assignImageToLevel(activeLevelIndex, processed);
        saveState();
        renderGrid();
      } catch (error) {
        console.error('Erro ao trocar imagem', error);
      } finally {
        closeModal();
      }
    });

    uploadBtn.addEventListener('click', () => uploadInput.click());
    uploadInput.addEventListener('change', (event) => {
      const { files } = event.target;
      if (!files?.length) return;
      handleUpload(files);
      uploadInput.value = '';
    });

    levelFilter.addEventListener('change', (event) => {
      selectedLevelFilter = event.target.value;
      renderGrid();
    });

    newGridBtn.addEventListener('click', () => {
      if (!confirm('Criar uma nova grade vazia? Isso substitui sua edição local.')) return;
      levels = [];
      selectedLevelFilter = 'all';
      buildLevelFilter();
      saveState();
      renderGrid();
    });

    const downloadBlob = (blob, filename) => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    };

    exportJsonBtn.addEventListener('click', () => {
      const payload = levels
        .filter(level => level.file && level.pt && level.en && level.folder)
        .map(level => ({
          imagem: level.file,
          nomePortugues: level.pt,
          nomeIngles: level.en,
          categoria: level.folder
        }));
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      downloadBlob(blob, 'levels-personalizado.json');
    });

    const fetchRemoteImage = async (path) => {
      if (imageCache.has(path)) return imageCache.get(path);
      const response = await fetch(path);
      const blob = await response.blob();
      const dataUrl = await readFileAsDataUrl(blob);
      imageCache.set(path, dataUrl);
      return dataUrl;
    };

    exportImagesBtn.addEventListener('click', async () => {
      const zip = new JSZip();
      for (let i = 0; i < levels.length; i++) {
        const level = levels[i];
        const folderName = `${resolveLevelNumber(level, i)}`;
        const folder = zip.folder(`${folderName}/`);

        if (!level.file && !level.dataUrl) continue;
        try {
          const ext = (level.format || 'webp').toLowerCase();
          let dataUrl = level.dataUrl;
          if (!dataUrl && level.file) {
            dataUrl = await fetchRemoteImage(`images/${level.file}`);
          }
          if (!dataUrl) continue;
          const base64 = dataUrl.split(',')[1];
          folder.file(level.file || `nivel-${i + 1}.${ext}`, base64, { base64: true });
        } catch (error) {
          console.error('Erro ao adicionar imagem ao zip', error);
        }
      }

      const blob = await zip.generateAsync({ type: 'blob' });
      downloadBlob(blob, 'levels-imagens.zip');
    });

    const init = async () => {
      toggleLoading(true);
      const local = loadState();
      if (local) {
        levels = local;
        buildLevelFilter();
        renderGrid();
        toggleLoading(false);
        return;
      }

      levels = await fetchDefaults();
      buildLevelFilter();
      renderGrid();
      toggleLoading(false);
    };

    init();
  </script>
</body>
</html>
