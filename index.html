<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <title>PlayTalk | App da Fluência</title>
  <meta
    name="description"
    content="PlayTalk, o app da fluência, transforma desafios de vocabulário, listening e speaking em uma jornada gamificada para dominar o inglês."
  >
  <link rel="icon" type="image/svg+xml" href="SVG/logo.svg">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/vocabulary-game.css">
  <script src="js/mode-logos.js" defer></script>
  <script src="js/settings.js"></script>
  <script src="js/lens.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/home-journey.js" defer></script>
</head>
  <body class="page-home" data-lens-context="game">
    <header class="site-header" id="global-header">
    <div class="site-header__profile">
      <div class="site-header__avatar-container" id="header-avatar-container">
        <div class="site-header__avatar-ring">
          <img
            src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2296%22%20height%3D%2296%22%20viewBox%3D%220%200%2096%2096%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23c5d7ff%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%237fa8ff%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle%20cx%3D%2248%22%20cy%3D%2248%22%20r%3D%2248%22%20fill%3D%22url(%23g)%22/%3E%3Cpath%20fill%3D%22%23fff%22%20opacity%3D%220.85%22%20d%3D%22M48%2046a14%2014%200%201%200-14-14A14%2014%200%200%200%2048%2046Zm0%207c-12.1%200-22%206.56-22%2014.66V70a24%2024%200%200%200%2044%200v-2.34C70%2059.56%2060.1%2053%2048%2053Z%22/%3E%3C/svg%3E"
            alt="Foto do usuário"
            class="site-header__avatar"
            id="header-avatar"
          >
        </div>
      </div>
      <div class="site-header__text">
        <span class="site-header__name" id="header-username">Jogador</span>
        <span class="site-header__level" id="header-level">Nível 1</span>
      </div>
    </div>
    </header>
  <main id="home-main" class="home-layout" data-page-transition>
    <section class="journey-panel" id="journey-panel">
      <h1 class="journey-title">Fluency Journey</h1>
      <button class="journey-button" id="journey-start-btn" type="button">Iniciar Jornada</button>
      <button class="journey-button journey-button--secondary is-hidden" id="journey-reset-btn" type="button">
        Começar do zero
      </button>
    </section>

    <section class="vocabulary-game home-game is-hidden" id="home-game" data-game-root aria-hidden="true">
      <div class="game-main">
        <div class="game-status game-status--top" aria-label="Medalha atual">
          <div class="game-medal" aria-live="polite">
            <img id="game-medal-icon" src="medalhas/diamante.png" alt="Medalha diamante">
          </div>
        </div>
        <div class="board-wrapper">
          <div class="board" id="board">
            <div class="board__inner" id="board-inner"></div>
          </div>
        </div>
        <div class="game-status game-status--bottom" aria-label="Vidas restantes">
          <div class="game-hearts">
            <span class="game-heart" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                <path d="M12 21s-6.7-4.35-9.33-7.92C-0.28 9.16 1.54 4.5 5.7 4.5c2.02 0 3.5 1.18 4.3 2.5.8-1.32 2.28-2.5 4.3-2.5 4.16 0 5.98 4.66 3.03 8.58C18.7 16.65 12 21 12 21z"/>
              </svg>
            </span>
            <span class="game-heart" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                <path d="M12 21s-6.7-4.35-9.33-7.92C-0.28 9.16 1.54 4.5 5.7 4.5c2.02 0 3.5 1.18 4.3 2.5.8-1.32 2.28-2.5 4.3-2.5 4.16 0 5.98 4.66 3.03 8.58C18.7 16.65 12 21 12 21z"/>
              </svg>
            </span>
            <span class="game-heart" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                <path d="M12 21s-6.7-4.35-9.33-7.92C-0.28 9.16 1.54 4.5 5.7 4.5c2.02 0 3.5 1.18 4.3 2.5.8-1.32 2.28-2.5 4.3-2.5 4.16 0 5.98 4.66 3.03 8.58C18.7 16.65 12 21 12 21z"/>
              </svg>
            </span>
            <span class="game-heart" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                <path d="M12 21s-6.7-4.35-9.33-7.92C-0.28 9.16 1.54 4.5 5.7 4.5c2.02 0 3.5 1.18 4.3 2.5.8-1.32 2.28-2.5 4.3-2.5 4.16 0 5.98 4.66 3.03 8.58C18.7 16.65 12 21 12 21z"/>
              </svg>
            </span>
            <span class="game-heart" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                <path d="M12 21s-6.7-4.35-9.33-7.92C-0.28 9.16 1.54 4.5 5.7 4.5c2.02 0 3.5 1.18 4.3 2.5.8-1.32 2.28-2.5 4.3-2.5 4.16 0 5.98 4.66 3.03 8.58C18.7 16.65 12 21 12 21z"/>
              </svg>
            </span>
          </div>
        </div>
        <div class="text-container" id="text-container" aria-live="polite"></div>
        <div class="choice-row" id="choice-row"></div>
      </div>

      <div class="progress-footer">
        <div class="progress-bar" aria-label="Progresso do dia">
          <div class="progress-bar__fill" id="progress-fill"></div>
        </div>
      </div>

      <section class="start-screen" id="start-screen">
        <img src="SVG/logo.png" alt="PlayTalk" class="start-screen__logo">
        <div class="start-screen__text" id="rotating-text">Fluência Fácil</div>
      </section>

      <section class="game-overlay hidden" id="phase-transition">
        <div class="overlay-card">
          <h1 id="phase-transition-title">Fase 2</h1>
          <div class="overlay-actions">
            <button class="btn-orange" id="phase-transition-btn">Iniciar fase 2</button>
          </div>
          <p class="phase-audio-skip is-hidden" id="phase-audio-skip">pular para o jogo</p>
          <div class="phase-audio-progress" id="phase-audio-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="phase-audio-progress__fill" id="phase-audio-progress-fill"></div>
          </div>
        </div>
      </section>

      <section class="game-overlay hidden" id="level-complete">
        <div class="overlay-card">
          <h1>Pronto para o próximo dia?</h1>
          <p id="level-complete-text"></p>
          <p class="level-complete__countdown" id="level-countdown"></p>
          <div class="overlay-actions">
            <button class="btn-primary" id="next-level-btn">Ir para o próximo</button>
            <button class="btn-primary" id="replay-level-btn">Jogar novamente</button>
          </div>
        </div>
      </section>

      <div class="full-green-overlay" id="progress-complete-overlay" aria-hidden="true"></div>
      <div class="final-overlay" id="final-overlay" aria-hidden="true">
        <div class="final-overlay__medal">
          <img id="final-medal-image" src="medalhas/diamante.png" alt="Medalha diamante">
          <span id="final-medal-label">Diamante</span>
        </div>
        <div class="final-overlay__stats">
          <div class="final-stat">
            <img class="final-stat__icon" src="SVG/speed.svg" alt="Ícone de tempo">
            <div class="final-stat__value" id="final-total-time">00:00</div>
            <div class="final-stat__label">Tempo</div>
          </div>
        <div class="final-stat final-stat--rotating" id="final-rotating-stat">
          <img class="final-stat__icon" src="SVG/speed.svg" alt="Ícone de pronúncia">
          <div class="final-stat__content">
            <div class="final-stat__value" id="final-pronunciation">0%</div>
            <div class="final-stat__label" id="final-rotating-label">Pronúncia</div>
          </div>
        </div>
          <div class="final-stat">
            <img class="final-stat__icon" src="SVG/speed.svg" alt="Ícone de memória">
            <div class="final-stat__value" id="final-memory">--</div>
            <div class="final-stat__label">Memory</div>
          </div>
        </div>
        <div class="final-overlay__actions">
          <a class="btn-primary" href="flashcards.html">FlashCards</a>
          <a class="btn-primary" href="medalhas">Meus selos</a>
        </div>
        <div class="final-overlay__bar" id="final-progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100">
          <div class="final-overlay__fill" id="final-progress-fill"></div>
        </div>
      </div>

      <button type="button" class="game-pause" id="game-pause-btn" aria-label="Pausar e voltar ao menu">⏸</button>

      <audio id="audio-success" src="gamesounds/success.mp3" preload="auto"></audio>
      <audio id="audio-error" src="gamesounds/error.mp3" preload="auto"></audio>
      <audio id="audio-conclusao" src="gamesounds/conclusao.mp3" preload="auto"></audio>
      <audio id="audio-mic" src="gamesounds/mic.mp3" preload="auto"></audio>
    </section>
  </main>

  <footer class="page-footer">
    <nav id="main-nav">
      <a
        href="inplay.html"
        id="home-link"
        class="nav-item"
        aria-label="Inplay"
        data-nav-index="0"
      >
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img" focusable="false"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
        </span>
        <span class="sr-only">Inplay</span>
      </a>
      <a href="fun.html" class="nav-item" aria-label="Opções" data-nav-index="1">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img" focusable="false"><path d="M19.14 12.94a7.97 7.97 0 0 0 .06-.94 7.97 7.97 0 0 0-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.88 7.88 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.14.55-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.65 8.48a.5.5 0 0 0 .12.64l2.03 1.58a7.97 7.97 0 0 0-.06.94c0 .32.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96c.49.39 1.04.7 1.63.94l.36 2.54a.5.5 0 0 0 .5.42h3.84a.5.5 0 0 0 .5-.42l.36-2.54c.59-.24 1.14-.55 1.63-.94l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64Zm-7.14 1.56a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5Z"/></svg>
        </span>
        <span class="sr-only">Opções</span>
      </a>
      <a href="play.html" class="nav-item" aria-label="Estatísticas" data-nav-index="2">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img" focusable="false"><path d="M5 21a1 1 0 0 1-1-1V10a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H5Zm6 0a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1h-2Zm6 0a1 1 0 0 1-1-1V13a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1h-2Z"/></svg>
        </span>
        <span class="sr-only">Estatísticas</span>
      </a>
      <a href="perfil.html" class="nav-item" aria-label="Perfil" data-nav-index="4">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img" focusable="false"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5Zm0 2c-4 0-7 2-7 4.5V21h14v-2.5C19 16 16 14 12 14Z"/></svg>
        </span>
        <span class="sr-only">Perfil</span>
      </a>
    </nav>
  </footer>
  <script src="js/main.js" defer></script>
  <script src="js/vocabulary-game.js" defer></script>
</body>
</html>
