<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <title>PlayTalk | Vocabulary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="SVG/logo.svg">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/settings.js"></script>
  <script src="js/lens.js"></script>
  <script src="js/auth.js"></script>
  <style>
    :root {
      --primary: #0b1f44;
      --secondary: #4c96dc;
      --panel: rgba(11, 31, 68, 0.06);
      --border: rgba(11, 31, 68, 0.12);
      --text: #0b1f44;
      --success: #2ecc71;
      --danger: #e74c3c;
      --muted: rgba(11, 31, 68, 0.7);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Open Sans', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: url('backgrounds/background6.jpg') center/cover no-repeat fixed;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .start-screen {
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      text-align: center;
      cursor: pointer;
      z-index: 1500;
      user-select: none;
    }

    .start-screen.hidden {
      display: none;
    }

    .start-screen__logo {
      width: min(240px, 70vw);
      max-width: 280px;
      height: auto;
    }

    .start-screen__text {
      font-size: 22px;
      font-weight: 800;
      color: var(--primary);
      transition: opacity 0.4s ease;
    }

    .start-screen__text.is-fading {
      opacity: 0;
    }

    .start-screen__button {
      min-width: 180px;
    }

    .start-screen--blank > * {
      opacity: 0;
    }

    .start-screen__difficulty {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: min(300px, 80vw);
    }

    .start-screen__difficulty.hidden {
      display: none;
    }

    .start-screen__difficulty-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .start-screen__difficulty-btn {
      width: 100%;
    }

    @media (min-width: 1024px) {
      .start-screen__text {
        font-size: 29px;
      }
    }

    .game-status {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 8;
    }

    .game-status--top {
      margin-bottom: 8px;
    }

    .game-status--bottom {
      margin-top: 16px;
    }

    .game-hearts {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .game-heart {
      width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease;
    }

    .game-heart svg {
      width: 100%;
      height: 100%;
      fill: #e74c3c;
    }

    .game-heart--lost {
      opacity: 0;
    }

    .game-medal {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border-radius: 0;
      background: transparent;
      border: none;
      box-shadow: none;
    }

    .game-medal img {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }


    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: calc(var(--header-height) + 24px) 16px calc(var(--nav-height) + 80px);
      position: relative;
      gap: 12px;
    }

    .board-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 0;
    }

    .board {
      width: min(450px, 100%);
      max-width: 450px;
      height: 450px;
      background: rgba(11, 31, 68, 0.04);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      transition: opacity 0.5s ease;
    }

    .board.board--expanded {
      width: min(550px, 100%);
      max-width: 550px;
      height: 550px;
    }

    .board.board--compact {
      width: min(360px, 100%);
      max-width: 360px;
      height: 360px;
      background: transparent;
      border: none;
      box-shadow: none;
    }

    @media (max-width: 768px) {
      .board { width: 360px; height: 360px; }
      .board.board--expanded { width: min(420px, 100%); height: 460px; }
      .board.board--compact { width: min(300px, 100%); height: 300px; }
    }

    .board__inner {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      transition: opacity 0.5s ease;
    }

    .board.board--compact .board__inner {
      gap: 6px;
    }

    .board__inner--grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      place-items: center;
    }

    .board__image-single {
      max-width: 90%;
      max-height: 90%;
      opacity: 0.85;
    }

    .board__image-single--phase-one {
      opacity: 1;
    }

    .board__image-speech {
      opacity: 0.6;
      cursor: pointer;
      transition: opacity 0.5s ease, transform 0.2s ease;
    }

    .board__image-speech--static {
      cursor: default;
    }

    .board__image-speech--listening {
      opacity: 1;
      transform: scale(1.02);
    }

    .board__mic-prompt {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
    }

    .board__mic-button {
      background: transparent;
      border: none;
      padding: 0;
      cursor: pointer;
    }

    .board__mic-button:disabled {
      cursor: default;
      opacity: 0.8;
    }

    .board__mic-image {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      object-fit: cover;
      opacity: 0.6;
    }

    .board__mic-text {
      margin: 0;
      font-size: 14px;
      line-height: 1.3;
      color: var(--muted);
      letter-spacing: 0.3px;
      text-transform: lowercase;
    }

    .phase-mic-hint {
      margin: 8px 0 0;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 768px) {
      .board__mic-image {
        width: 180px;
        height: 180px;
      }
    }

    .grid-card {
      width: 150px;
      height: 150px;
      border-radius: 20px;
      background-color: rgba(11, 31, 68, 0.08);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, background-color 300ms ease, opacity 300ms ease;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      opacity: 1;
    }

    .grid-card--static {
      pointer-events: none;
      cursor: default;
    }

    .grid-card img { width: 120px; height: 120px; object-fit: contain; }
    .grid-card img.image--webp { object-fit: cover; border-radius: 50%; }

    .board__image-single.image--webp {
      border-radius: 50%;
      object-fit: cover;
      aspect-ratio: 1 / 1;
    }

    .grid-card--correct { background-color: rgba(46, 204, 113, 0.5); }
    .grid-card--wrong { background-color: rgba(231, 76, 60, 0.5); }

    .grid-card--enter {
      opacity: 0;
      animation: cardFadeIn 0.5s ease forwards;
    }

    .board--hidden { opacity: 0; pointer-events: none; }

    .hidden-phase { opacity: 0; pointer-events: none; }

    .text-container {
      margin-top: 12px;
      width: min(480px, 100%);
      min-height: 48px;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .text-container.active { opacity: 1; }

    .text-container--compact {
      width: auto;
      margin-top: 6px;
      min-height: 32px;
    }

    .choice-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
      justify-content: center;
      align-items: center;
      margin-top: 12px;
      position: relative;
      top: -30px;
      transition: opacity 0.5s ease;
      width: min(450px, 100%);
    }

    .choice-row--compact {
      width: auto;
      margin-top: 6px;
    }

    .choice-btn {
      background: #2c6fbf;
      color: #fff;
      border: none;
      padding: 15px 23px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease;
      min-width: 192px;
      width: 100%;
      font-size: 26px;
      font-family: 'Open Sans', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      text-transform: capitalize;
    }

    .choice-btn:hover { transform: translateY(-1px); }
    .choice-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

    .choice-btn.success { background: var(--success); }
    .choice-btn.error { background: var(--danger); }

    .phase-word-btn {
      background: linear-gradient(120deg, #3a86d1, #4c96dc);
      color: #fff;
      border: none;
      padding: 18px 28px;
      border-radius: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease;
      min-width: 282px;
      width: min(360px, 100%);
      font-size: 30px;
      font-family: 'Open Sans', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      text-transform: capitalize;
      box-shadow: 0 8px 24px rgba(76, 150, 220, 0.3);
      position: relative;
      top: -30px;
    }

    .phase-word-btn:hover { transform: translateY(-1px); }

    .phase-word-btn--listening {
      box-shadow: 0 0 0 4px rgba(76, 150, 220, 0.25);
      transform: translateY(-1px) scale(1.01);
    }

    .phase-word-btn--icon-only {
      width: 110px;
      height: 110px;
      min-width: auto;
      font-size: 41px;
      border-radius: 50%;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .progress-footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(var(--nav-height) + 25px);
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    .progress-bar {
      width: min(520px, 92%);
      height: 12px;
      background: rgba(11, 31, 68, 0.08);
      border-radius: 999px;
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(11, 31, 68, 0.12);
    }

    .progress-bar__fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3a86d1, #4c96dc);
      transition: width 0.25s ease;
    }

    .game-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(7, 19, 40, 0.7);
      backdrop-filter: blur(6px);
      z-index: 10;
    }

    .game-overlay.hidden { display: none; }

    .full-green-overlay {
      position: fixed;
      inset: 0;
      background: #17a94c;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .full-green-overlay.active {
      display: flex;
    }

    .final-overlay {
      position: fixed;
      inset: 0;
      background: #fff;
      z-index: 25;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 24px;
    }

    .final-overlay.active {
      display: flex;
    }

    .final-overlay__bar {
      width: min(520px, 92%);
      height: 16px;
      background: rgba(11, 31, 68, 0.06);
      border: 1px solid var(--border);
      border-radius: 999px;
      overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .final-overlay__fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #3a86d1, #4c96dc);
      transition: width 0.15s linear;
    }

    .final-overlay__medal {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .final-overlay__medal img {
      width: 120px;
      height: 120px;
      object-fit: contain;
    }


    .phase-audio-progress {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: rgba(11, 31, 68, 0.12);
      overflow: hidden;
      margin-top: 12px;
    }

    .phase-audio-progress__fill {
      width: 0%;
      height: 100%;
      background: var(--secondary);
      transition: width 0.2s ease;
    }

    .overlay-card {
      width: min(520px, 92%);
      background: #fff;
      color: #0b1f44;
      border-radius: 20px;
      padding: 32px 28px;
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.28);
      text-align: center;
    }

    .overlay-card h1 {
      margin: 0 0 24px;
      font-size: 26px;
      font-weight: 800;
    }

    .phase-list {
      list-style: none;
      padding-left: 0;
      margin: 0 0 12px;
      display: grid;
      gap: 8px;
    }

    .phase-list li {
      background: rgba(27, 79, 154, 0.06);
      border: 1px solid rgba(27, 79, 154, 0.12);
      border-radius: 12px;
      padding: 8px 10px;
      font-weight: 600;
      color: #0b1f44;
    }

    .overlay-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .btn-primary {
      background: linear-gradient(120deg, #3a86d1, #4c96dc);
      color: #fff;
      border: none;
      padding: 15px 23px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    .btn-primary:hover { transform: translateY(-1px); }

    .btn-primary:disabled {
      cursor: default;
      opacity: 0.6;
    }

    .btn-orange {
      background: linear-gradient(120deg, #ffb347, #ff7a18);
      color: #fff;
      border: none;
      padding: 26px 29px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 29px;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.2s ease;
      width: 100%;
    }

    .level-complete__countdown {
      margin: 8px 0 0;
      font-size: 20px;
      font-weight: 700;
      color: var(--primary);
    }

    .btn-orange:hover { transform: translateY(-1px); }

    .btn-orange:disabled {
      background: linear-gradient(120deg, #b9b9b9, #9e9e9e);
      cursor: not-allowed;
      opacity: 0.9;
      transform: none;
    }

    @keyframes cardFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    .is-hidden {
      display: none !important;
    }
  </style>
</head>
<body class="page-game" data-lens-context="game">
  <header class="site-header" id="global-header">
    <div class="site-header__profile">
      <div class="site-header__avatar-container" id="header-avatar-container">
        <div class="site-header__avatar-ring">
          <img
            src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2296%22%20height%3D%2296%22%20viewBox%3D%220%200%2096%2096%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23c5d7ff%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%237fa8ff%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle%20cx%3D%2248%22%20cy%3D%2248%22%20r%3D%2248%22%20fill%3D%22url(%23g)%22/%3E%3Cpath%20fill%3D%22%23fff%22%20opacity%3D%220.85%22%20d%3D%22M48%2046a14%2014%200%201%200-14-14A14%2014%200%200%200%2048%2046Zm0%207c-12.1%200-22%206.56-22%2014.66V70a24%2024%200%200%200%2044%200v-2.34C70%2059.56%2060.1%2053%2048%2053Z%22/%3E%3C/svg%3E"
            alt="Foto do usuário"
            class="site-header__avatar"
            id="header-avatar"
          >
        </div>
      </div>
      <div class="site-header__text">
        <span class="site-header__name" id="header-username">Jogador</span>
        <span class="site-header__level" id="header-level">Nível 1</span>
      </div>
    </div>
    <div class="site-header__actions">
      <button id="login-btn" class="site-header__button" type="button">Entrar</button>
    </div>
  </header>
  <main>
    <div class="game-status game-status--top" aria-label="Medalha atual">
      <div class="game-medal" aria-live="polite">
        <img id="game-medal-icon" src="medalhas/diamante.png" alt="Medalha diamante">
      </div>
    </div>
    <div class="board-wrapper">
      <div class="board" id="board">
        <div class="board__inner" id="board-inner"></div>
      </div>
    </div>
    <div class="game-status game-status--bottom" aria-label="Vidas restantes">
      <div class="game-hearts">
        <span class="game-heart" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
            <path d="M12 21s-6.7-4.35-9.33-7.92C-0.28 9.16 1.54 4.5 5.7 4.5c2.02 0 3.5 1.18 4.3 2.5.8-1.32 2.28-2.5 4.3-2.5 4.16 0 5.98 4.66 3.03 8.58C18.7 16.65 12 21 12 21z"/>
          </svg>
        </span>
        <span class="game-heart" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
            <path d="M12 21s-6.7-4.35-9.33-7.92C-0.28 9.16 1.54 4.5 5.7 4.5c2.02 0 3.5 1.18 4.3 2.5.8-1.32 2.28-2.5 4.3-2.5 4.16 0 5.98 4.66 3.03 8.58C18.7 16.65 12 21 12 21z"/>
          </svg>
        </span>
        <span class="game-heart" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
            <path d="M12 21s-6.7-4.35-9.33-7.92C-0.28 9.16 1.54 4.5 5.7 4.5c2.02 0 3.5 1.18 4.3 2.5.8-1.32 2.28-2.5 4.3-2.5 4.16 0 5.98 4.66 3.03 8.58C18.7 16.65 12 21 12 21z"/>
          </svg>
        </span>
      </div>
    </div>
    <div class="text-container" id="text-container" aria-live="polite"></div>
    <div class="choice-row" id="choice-row"></div>
  </main>

  <div class="progress-footer">
    <div class="progress-bar" aria-label="Progresso do nível">
      <div class="progress-bar__fill" id="progress-fill"></div>
    </div>
  </div>

  <section class="start-screen" id="start-screen">
    <img src="SVG/logo.png" alt="PlayTalk" class="start-screen__logo">
    <div class="start-screen__text" id="rotating-text">Fluência Fácil</div>
  </section>

  <section class="game-overlay hidden" id="phase-transition">
    <div class="overlay-card">
      <h1 id="phase-transition-title">Fase 2</h1>
      <div class="overlay-actions">
        <button class="btn-orange" id="phase-transition-btn">Iniciar fase 2</button>
      </div>
      <div class="phase-audio-progress" id="phase-audio-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="phase-audio-progress__fill" id="phase-audio-progress-fill"></div>
      </div>
    </div>
  </section>

  <section class="game-overlay hidden" id="level-complete">
    <div class="overlay-card">
      <h1>Pronto para o próximo nível?</h1>
      <p id="level-complete-text"></p>
      <p class="level-complete__countdown" id="level-countdown"></p>
      <div class="overlay-actions">
        <button class="btn-primary" id="next-level-btn">Ir para o próximo</button>
        <button class="btn-primary" id="replay-level-btn">Jogar novamente</button>
      </div>
    </div>
  </section>

  <div class="full-green-overlay" id="progress-complete-overlay" aria-hidden="true"></div>
  <div class="final-overlay" id="final-overlay" aria-hidden="true">
    <div class="final-overlay__bar" id="final-progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100">
      <div class="final-overlay__fill" id="final-progress-fill"></div>
    </div>
    <div class="final-overlay__medal">
      <img id="final-medal-image" src="medalhas/diamante.png" alt="Medalha diamante">
    </div>
  </div>

  <footer class="page-footer">
    <nav id="main-nav">
      <a href="inplay.html" class="nav-item" aria-label="Inplay" data-nav-index="0">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img" focusable="false"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
        </span>
        <span class="sr-only">Inplay</span>
      </a>
