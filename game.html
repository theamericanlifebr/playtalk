<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <title>PlayTalk | Game</title>
  <meta
    name="description"
    content="PlayTalk, o app da fluência, transforma desafios de vocabulário, listening e speaking em uma jornada gamificada para dominar o inglês."
  >
  <link rel="icon" type="image/svg+xml" href="SVG/logo.svg">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/settings.js"></script>
  <script src="js/lens.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/kit-speech.js"></script>
  <script src="js/image-game.js" defer></script>
</head>
<body class="page-inplay page-image-game" data-lens-context="game">

  </div>
  <header class="site-header" id="global-header">
    <div class="site-header__profile">
      <div class="site-header__avatar-container" id="header-avatar-container">
        <div class="site-header__avatar-ring">
          <img
            src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2296%22%20height%3D%2296%22%20viewBox%3D%220%200%2096%2096%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23c5d7ff%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%237fa8ff%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle%20cx%3D%2248%22%20cy%3D%2248%22%20r%3D%2248%22%20fill%3D%22url(%23g)%22/%3E%3Cpath%20fill%3D%22%23fff%22%20opacity%3D%220.85%22%20d%3D%22M48%2046a14%2014%200%201%200-14-14A14%2014%200%200%200%2048%2046Zm0%207c-12.1%200-22%206.56-22%2014.66V70a24%2024%200%200%200%2044%200v-2.34C70%2059.56%2060.1%2053%2048%2053Z%22/%3E%3C/svg%3E"
            alt="Foto do usuário"
            class="site-header__avatar"
            id="header-avatar"
          >
        </div>
      </div>
      <div class="site-header__text">
        <span class="site-header__name" id="header-username">Jogador</span>
        <span class="site-header__level" id="header-level">Nível 1</span>
      </div>
    </div>
    <div class="site-header__actions">
      <button id="login-btn" class="site-header__button" type="button">Entrar</button>
    </div>
  </header>
  <main id="game-main" class="container-screen container-screen--home" data-page-transition>
    <div id="visor" class="image-game-visor">
      <div class="visor-stack">
        <div id="image-game-instruction" class="level-instruction" role="status" aria-live="polite">
          Fale a palavra em inglês para a imagem.
        </div>
        <div class="mode-emblem image-game-emblem">
          <img id="image-game-target" class="image-game-target" alt="Imagem do jogo" />
        </div>
        <div class="phrase-stack">
          <div id="image-game-status" class="image-game-status" aria-live="polite"></div>
          <div id="image-game-transcript" class="user-transcript" aria-live="polite"></div>
          <div id="image-game-english" class="image-game-english" hidden></div>
        </div>
      </div>
    </div>
  </main>
  <div class="image-game-footer" aria-label="Controles do jogo">
    <div class="image-game-actions" role="group" aria-label="Ações do jogo">
      <button id="image-game-mic" class="image-game-action image-game-action--mic" type="button" aria-pressed="false" aria-label="Ativar microfone">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12Z"/>
        </svg>
      </button>
      <button id="image-game-audio" class="image-game-action" type="button" aria-label="Ouvir palavra em inglês">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9v6h4l5 5V4L8 9H4Zm12.5 3a4.5 4.5 0 0 0-1.5-3.38v6.76A4.5 4.5 0 0 0 16.5 12Zm0-7a9.5 9.5 0 0 1 0 14 1 1 0 0 0 1.42 1.42 11.5 11.5 0 0 0 0-16.84A1 1 0 0 0 16.5 5Z"/>
        </svg>
      </button>
      <button id="image-game-translate" class="image-game-action" type="button" aria-pressed="false" aria-label="Mostrar palavra em inglês">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 5c-5 0-9 4.03-10 7 1 2.97 5 7 10 7s9-4.03 10-7c-1-2.97-5-7-10-7Zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10Zm0-2.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z"/>
        </svg>
      </button>
    </div>
  </div>
</body>
</html>
