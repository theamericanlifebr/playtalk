<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <title>PlayTalk | Vocabulary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="SVG/logo.svg">
  <link rel="stylesheet" href="css/vocabulary-game.css">

</head>
<body class="vocabulary-game" data-game-root>
  <script>
    window.location.replace('/#home');
  </script>
  <main class="game-main">
    <div class="game-status game-status--top" aria-label="Medalha atual">
      <div class="game-medal" aria-live="polite">
        <img id="game-medal-icon" src="medalhas/diamante.png" alt="Medalha diamante">
      </div>
    </div>
    <div class="board-wrapper">
      <div class="board" id="board">
        <div class="board__inner" id="board-inner"></div>
      </div>
    </div>
    <div class="game-status game-status--bottom" aria-label="Vidas restantes">
      <div class="game-hearts">
        <span class="game-heart" aria-hidden="true">
          <img class="game-heart-icon" src="medalhas/diamante.png" alt="">
        </span>
        <span class="game-heart" aria-hidden="true">
          <img class="game-heart-icon" src="medalhas/diamante.png" alt="">
        </span>
        <span class="game-heart" aria-hidden="true">
          <img class="game-heart-icon" src="medalhas/diamante.png" alt="">
        </span>
        <span class="game-heart" aria-hidden="true">
          <img class="game-heart-icon" src="medalhas/diamante.png" alt="">
        </span>
        <span class="game-heart" aria-hidden="true">
          <img class="game-heart-icon" src="medalhas/diamante.png" alt="">
        </span>
      </div>
    </div>
    <div class="text-container" id="text-container" aria-live="polite"></div>
    <div class="choice-row" id="choice-row"></div>
  </main>

  <div class="progress-footer">
    <div class="progress-bar" aria-label="Progresso do dia">
      <div class="progress-bar__fill" id="progress-fill"></div>
    </div>
  </div>

  <section class="start-screen" id="start-screen">
    <img src="SVG/logo.png" alt="PlayTalk" class="start-screen__logo">
    <div class="start-screen__text" id="rotating-text">Fluência Fácil</div>
  </section>

  <section class="game-overlay hidden" id="phase-transition">
    <div class="overlay-card">
      <h1 id="phase-transition-title">Fase 2</h1>
      <div class="overlay-actions">
        <button class="btn-orange" id="phase-transition-btn">Iniciar fase 2</button>
      </div>
      <p class="phase-audio-skip is-hidden" id="phase-audio-skip">pular para o jogo</p>
      <div class="phase-audio-progress" id="phase-audio-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="phase-audio-progress__fill" id="phase-audio-progress-fill"></div>
      </div>
    </div>
  </section>

  <section class="game-overlay hidden" id="level-complete">
    <div class="overlay-card">
      <h1>Pronto para o próximo dia?</h1>
      <p id="level-complete-text"></p>
      <p class="level-complete__countdown" id="level-countdown"></p>
      <div class="overlay-actions">
        <button class="btn-primary" id="next-level-btn">Ir para o próximo</button>
        <button class="btn-primary" id="replay-level-btn">Jogar novamente</button>
      </div>
    </div>
  </section>

  <div class="full-green-overlay" id="progress-complete-overlay" aria-hidden="true"></div>
  <div class="final-overlay" id="final-overlay" aria-hidden="true">
    <div class="final-overlay__medal">
      <img id="final-medal-image" src="medalhas/diamante.png" alt="Medalha diamante">
      <span id="final-medal-label">Diamante</span>
    </div>
    <div class="final-overlay__stats">
      <div class="final-stat">
        <img class="final-stat__icon" src="SVG/speed.svg" alt="Ícone de tempo">
        <div class="final-stat__value" id="final-total-time">00:00</div>
        <div class="final-stat__label">Tempo</div>
      </div>
      <div class="final-stat final-stat--rotating" id="final-rotating-stat">
        <img class="final-stat__icon" src="SVG/speed.svg" alt="Ícone de pronúncia">
        <div class="final-stat__content">
          <div class="final-stat__value" id="final-pronunciation">0%</div>
          <div class="final-stat__label" id="final-rotating-label">Pronúncia</div>
        </div>
      </div>
      <div class="final-stat">
        <img class="final-stat__icon" src="SVG/speed.svg" alt="Ícone de memória">
        <div class="final-stat__value" id="final-memory">--</div>
        <div class="final-stat__label">Memory</div>
      </div>
    </div>
    <div class="final-overlay__actions">
      <a class="btn-primary" href="flashcards.html">FlashCards</a>
      <a class="btn-primary" href="medalhas">Meus selos</a>
    </div>
    <div class="final-overlay__bar" id="final-progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100">
      <div class="final-overlay__fill" id="final-progress-fill"></div>
    </div>
  </div>

  <audio id="audio-success" src="gamesounds/success.mp3" preload="auto"></audio>
  <audio id="audio-error" src="gamesounds/error.mp3" preload="auto"></audio>
  <audio id="audio-conclusao" src="gamesounds/conclusao.mp3" preload="auto"></audio>
  <audio id="audio-mic" src="gamesounds/mic.mp3" preload="auto"></audio>

  <script src="js/vocabulary-game.js"></script>
</body>
</html>
