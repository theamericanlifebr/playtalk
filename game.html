<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <title>PlayTalk | Vocabulary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="SVG/logo.svg">
  <style>
    :root {
      --primary: #0b1f44;
      --secondary: #4c96dc;
      --panel: rgba(11, 31, 68, 0.06);
      --border: rgba(11, 31, 68, 0.12);
      --text: #0b1f44;
      --success: #2ecc71;
      --danger: #e74c3c;
      --muted: rgba(11, 31, 68, 0.7);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Open Sans', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #fff;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .start-screen {
      position: fixed;
      inset: 0;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      text-align: center;
      cursor: pointer;
      z-index: 30;
      user-select: none;
    }

    .start-screen.hidden {
      display: none;
    }

    .start-screen__logo {
      width: min(240px, 70vw);
      max-width: 280px;
      height: auto;
    }

    .start-screen__text {
      font-size: 22px;
      font-weight: 800;
      color: var(--primary);
      transition: opacity 0.4s ease;
    }

    .start-screen__text.is-fading {
      opacity: 0;
    }

    .start-screen--blank > * {
      opacity: 0;
    }

    @media (min-width: 1024px) {
      .start-screen__text {
        font-size: 29px;
      }
    }

    header {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(6px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 18px;
    }

    .level-indicator {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 12px;
      font-weight: 700;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 16px 80px;
      position: relative;
    }

    .board-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 25px;
    }

    .board {
      width: min(450px, 100%);
      max-width: 450px;
      height: 450px;
      background: rgba(11, 31, 68, 0.04);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      transition: opacity 0.5s ease;
    }

    .board.board--expanded {
      width: min(550px, 100%);
      max-width: 550px;
      height: 550px;
    }

    @media (max-width: 768px) {
      .board { width: 360px; height: 360px; }
      .board.board--expanded { width: min(420px, 100%); height: 460px; }
    }

    .board__inner {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .board__inner--grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      place-items: center;
    }

    .board__image-single {
      max-width: 90%;
      max-height: 90%;
      opacity: 0.85;
    }

    .grid-card {
      width: 150px;
      height: 150px;
      border-radius: 20px;
      background-color: rgba(11, 31, 68, 0.08);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, background-color 300ms ease, opacity 300ms ease;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      opacity: 1;
    }

    .grid-card--static {
      pointer-events: none;
      cursor: default;
    }

    .grid-card img { width: 120px; height: 120px; object-fit: contain; }

    .grid-card--correct { background-color: rgba(46, 204, 113, 0.5); }
    .grid-card--wrong { background-color: rgba(231, 76, 60, 0.5); }

    .grid-card--enter {
      opacity: 0;
      animation: cardFadeIn 0.5s ease forwards;
    }

    .board--hidden { opacity: 0; pointer-events: none; }

    .hidden-phase { opacity: 0; pointer-events: none; }

    .text-container {
      margin-top: 12px;
      width: min(480px, 100%);
      min-height: 48px;
      text-align: center;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .text-container.active { opacity: 1; }

    .choice-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 12px;
      transition: opacity 0.5s ease;
    }

    .choice-btn {
      background: #2c6fbf;
      color: #fff;
      border: none;
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease;
      min-width: 150px;
      font-size: 20px;
      font-family: 'Open Sans', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      text-transform: capitalize;
    }

    .choice-btn:hover { transform: translateY(-1px); }
    .choice-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

    .choice-btn.success { background: var(--success); }
    .choice-btn.error { background: var(--danger); }

    .phase-word-btn {
      background: linear-gradient(120deg, #3a86d1, #4c96dc);
      color: #fff;
      border: none;
      padding: 14px 22px;
      border-radius: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease;
      min-width: 220px;
      width: min(450px, 100%);
      font-size: 24px;
      font-family: 'Open Sans', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      text-transform: capitalize;
      box-shadow: 0 8px 24px rgba(76, 150, 220, 0.3);
    }

    .phase-word-btn:hover { transform: translateY(-1px); }

    .progress-footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 25px;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    .progress-bar {
      width: min(520px, 92%);
      height: 12px;
      background: rgba(11, 31, 68, 0.08);
      border-radius: 999px;
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(11, 31, 68, 0.12);
    }

    .progress-bar__fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3a86d1, #4c96dc);
      transition: width 0.25s ease;
    }

    .game-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(7, 19, 40, 0.7);
      backdrop-filter: blur(6px);
      z-index: 10;
    }

    .game-overlay.hidden { display: none; }

    .full-green-overlay {
      position: fixed;
      inset: 0;
      background: #17a94c;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .full-green-overlay.active {
      display: flex;
    }

    .overlay-card {
      width: min(520px, 92%);
      background: #fff;
      color: #0b1f44;
      border-radius: 20px;
      padding: 32px 28px;
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.28);
      text-align: center;
    }

    .overlay-card h1 {
      margin: 0 0 24px;
      font-size: 26px;
      font-weight: 800;
    }

    .phase-list {
      list-style: none;
      padding-left: 0;
      margin: 0 0 12px;
      display: grid;
      gap: 8px;
    }

    .phase-list li {
      background: rgba(27, 79, 154, 0.06);
      border: 1px solid rgba(27, 79, 154, 0.12);
      border-radius: 12px;
      padding: 8px 10px;
      font-weight: 600;
      color: #0b1f44;
    }

    .overlay-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .btn-primary {
      background: linear-gradient(120deg, #3a86d1, #4c96dc);
      color: #fff;
      border: none;
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    .btn-primary:hover { transform: translateY(-1px); }

    .btn-orange {
      background: linear-gradient(120deg, #ffb347, #ff7a18);
      color: #fff;
      border: none;
      padding: 16px 18px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 18px;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.2s ease;
      width: 100%;
    }

    .btn-orange:hover { transform: translateY(-1px); }

    .btn-orange:disabled {
      background: linear-gradient(120deg, #b9b9b9, #9e9e9e);
      cursor: not-allowed;
      opacity: 0.9;
      transform: none;
    }

    @keyframes cardFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span aria-hidden="true">🎯</span>
      <span id="phase-label">Fase 1</span>
    </div>
    <div class="level-indicator" id="level-indicator">Nível 1</div>
  </header>

  <main>
    <div class="board-wrapper">
      <div class="board" id="board">
        <div class="board__inner" id="board-inner"></div>
      </div>
    </div>
    <div class="text-container" id="text-container" aria-live="polite"></div>
    <div class="choice-row" id="choice-row"></div>
  </main>

  <div class="progress-footer">
    <div class="progress-bar" aria-label="Progresso do nível">
      <div class="progress-bar__fill" id="progress-fill"></div>
    </div>
  </div>

  <section class="start-screen" id="start-screen">
    <img src="SVG/logo.png" alt="PlayTalk" class="start-screen__logo">
    <div class="start-screen__text" id="rotating-text">Fluência Fácil</div>
  </section>

  <section class="game-overlay hidden" id="phase-transition">
    <div class="overlay-card">
      <h1 id="phase-transition-title">Fase 2</h1>
      <div class="overlay-actions">
        <button class="btn-orange" id="phase-transition-btn">Iniciar fase 2</button>
      </div>
    </div>
  </section>

  <section class="game-overlay hidden" id="level-complete">
    <div class="overlay-card">
      <h1>Pronto para o próximo nível?</h1>
      <p id="level-complete-text"></p>
      <div class="overlay-actions">
        <button class="btn-primary" id="next-level-btn">Ir para o próximo</button>
      </div>
    </div>
  </section>

  <div class="full-green-overlay" id="progress-complete-overlay" aria-hidden="true"></div>

  <audio id="audio-abertura" src="gamesounds/abertura.mp3" preload="auto"></audio>
  <audio id="audio-fase2" src="gamesounds/fase2.mp3" preload="auto"></audio>
  <audio id="audio-fase3" src="gamesounds/fase3.mp3" preload="auto"></audio>
  <audio id="audio-fase4" src="gamesounds/fase4.mp3" preload="auto"></audio>
  <audio id="audio-success" src="gamesounds/success.mp3" preload="auto"></audio>
  <audio id="audio-error" src="gamesounds/error.mp3" preload="auto"></audio>
  <audio id="audio-conclusao" src="gamesounds/conclusao.mp3" preload="auto"></audio>

  <script src="js/vocabulary-game.js"></script>
</body>
</html>
