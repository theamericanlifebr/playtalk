<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <title>PlayTalk | Game</title>
  <meta
    name="description"
    content="PlayTalk, o app da fluência, transforma desafios de vocabulário, listening e speaking em uma jornada gamificada para dominar o inglês."
  >
  <link rel="icon" type="image/svg+xml" href="SVG/logo.svg">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/settings.js"></script>
  <script src="js/lens.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/kit-speech.js"></script>
  <script src="js/image-game.js" defer></script>
</head>
<body class="page-inplay page-image-game" data-lens-context="game">

    <i></i>
  </div>
  <header class="site-header" id="global-header">
    <div class="site-header__profile">
      <div class="site-header__avatar-container" id="header-avatar-container">
        <div class="site-header__avatar-ring">
          <img
            src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2296%22%20height%3D%2296%22%20viewBox%3D%220%200%2096%2096%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23c5d7ff%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%237fa8ff%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle%20cx%3D%2248%22%20cy%3D%2248%22%20r%3D%2248%22%20fill%3D%22url(%23g)%22/%3E%3Cpath%20fill%3D%22%23fff%22%20opacity%3D%220.85%22%20d%3D%22M48%2046a14%2014%200%201%200-14-14A14%2014%200%200%200%2048%2046Zm0%207c-12.1%200-22%206.56-22%2014.66V70a24%2024%200%200%200%2044%200v-2.34C70%2059.56%2060.1%2053%2048%2053Z%22/%3E%3C/svg%3E"
            alt="Foto do usuário"
            class="site-header__avatar"
            id="header-avatar"
          >
        </div>
      </div>
      <div class="site-header__text">
        <span class="site-header__name" id="header-username">Jogador</span>
        <span class="site-header__level" id="header-level">Nível 1</span>
      </div>
    </div>
    <div class="site-header__actions">
      <button id="login-btn" class="site-header__button" type="button">Entrar</button>
    </div>
  </header>
  <main id="game-main" class="container-screen container-screen--home">
    <div class="image-game-shell" data-page-transition>
      <div id="visor" class="image-game-visor">
        <div class="visor-stack">
          <div class="image-game-level-header">
            <h2 class="image-game-level-title">Nível <span id="image-game-level-value">1</span></h2>
            <button id="image-game-start" class="image-game-start" type="button">Iniciar jogo</button>
          </div>
          <div id="image-game-instruction" class="level-instruction" role="status" aria-live="polite">
            Fale a palavra em inglês para a imagem.
          </div>
          <div class="mode-emblem image-game-emblem">
            <img id="image-game-target" class="image-game-target" alt="Imagem do jogo" />
          </div>
          <div class="phrase-stack">
            <div id="image-game-status" class="image-game-status" aria-live="polite"></div>
            <div id="image-game-transcript" class="user-transcript" aria-live="polite"></div>
            <div id="image-game-english" class="image-game-english" hidden></div>
          </div>
          <div class="image-game-answers">
            <div id="phase1-options" class="image-game-choice" hidden></div>
            <div id="phase2-grid" class="image-game-grid" hidden></div>
            <div id="phase3-hint" class="image-game-phase3-hint" hidden>Toque na imagem e fale em inglês.</div>
          </div>
          <div class="image-game-controls">
            <div class="image-game-score">
              <span id="image-game-round-label" class="image-game-round">Rodada 1</span>
              <span id="image-game-counts" class="image-game-counts">0 acertos · 0 erros</span>
            </div>
            <div class="image-game-progress" aria-label="Progresso da rodada">
              <div class="image-game-progress__track">
                <div
                  id="image-game-progress-bar"
                  class="image-game-progress__fill"
                  role="progressbar"
                  aria-valuemin="0"
                  aria-valuemax="100"
                  aria-valuenow="0"
                  aria-valuetext="0 de 0"
                ></div>
              </div>
              <span id="image-game-progress-label" class="image-game-progress__label">0/0</span>
            </div>
            <div class="image-game-manual">
              <button id="image-game-correct" class="image-game-mark image-game-mark--correct" type="button">
                Acertei
              </button>
              <button id="image-game-wrong" class="image-game-mark image-game-mark--wrong" type="button">
                Errei
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <div id="image-game-feedback" class="image-game-feedback" hidden>
    <div class="image-game-feedback__card">
      <h2 id="image-game-feedback-title">Rodada concluída</h2>
      <p id="image-game-feedback-description"></p>
      <div class="image-game-feedback__stats">
        <div class="image-game-feedback__stat">
          <span>Acertos</span>
          <strong id="image-game-feedback-correct">0</strong>
        </div>
        <div class="image-game-feedback__stat">
          <span>Erros</span>
          <strong id="image-game-feedback-errors">0</strong>
        </div>
      </div>
      <div class="image-game-feedback__actions">
        <button id="image-game-feedback-primary" class="image-game-feedback__button" type="button"></button>
        <button
          id="image-game-feedback-secondary"
          class="image-game-feedback__button image-game-feedback__button--ghost"
          type="button"
        ></button>
      </div>
    </div>
  </div>
</body>
</html>
