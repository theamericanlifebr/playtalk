<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <title>Opções | PlayTalk App</title>
  <meta
    name="description"
    content="Personalize o PlayTalk do seu jeito: ajuste cores, sons, vozes e estilos para a sua experiência."

  <link rel="icon" type="image/svg+xml" href="SVG/logo.svg">

<body class="page-fun" data-lens-context="menus">
  <header class="site-header" id="global-header">
    <div class="site-header__profile">
      <div class="site-header__avatar-container" id="header-avatar-container">
        <div class="site-header__avatar-ring">
          <img

            alt="Foto do usuário"
            class="site-header__avatar"
            id="header-avatar"
          >
        </div>
      </div>
      <div class="site-header__text">
        <span class="site-header__name" id="header-username">Jogador</span>
        <span class="site-header__level" id="header-level">Nível 1</span>
      </div>
    </div>
  </header>
  <main id="fun-container" class="fun-layout" data-page-transition>
    <div id="menu">
      <div id="menu-modes">
        <button class="menu-mode" data-game-mode="association" data-mode="5" type="button">
          <span class="mode-logo mode-logo--menu" data-mode="5" aria-hidden="true"></span>
          <span class="menu-mode__label">Connect</span>
        </button>
        <button class="menu-mode" data-game-mode="listening" data-mode="3" type="button">
          <span class="mode-logo mode-logo--menu" data-mode="3" aria-hidden="true"></span>
          <span class="menu-mode__label">Listening</span>
        </button>
        <button class="menu-mode" data-game-mode="reading" data-mode="4" type="button">
          <span class="mode-logo mode-logo--menu" data-mode="4" aria-hidden="true"></span>
          <span class="menu-mode__label">Reading</span>
        </button>
        <button class="menu-mode" data-game-mode="memory" data-mode="2" type="button">
          <span class="mode-logo mode-logo--menu" data-mode="2" aria-hidden="true"></span>
          <span class="menu-mode__label">Memory</span>
        </button>
      </div>
    </div>
    <div class="fun-game-overlay" id="fun-game-overlay" aria-hidden="true">
      <div class="fun-game-shell">
        <button class="fun-game-close" id="fun-game-close" type="button" aria-label="Fechar jogo">✕</button>
        <iframe class="fun-game-frame" id="fun-game-frame" title="PlayTalk game" loading="lazy"></iframe>
      </div>
    </div>
  </main>
