<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <title>Estatísticas | PlayTalk App</title>
  <meta
    name="description"
    content="Painel de controle da sua fluência: navegue entre os modos de jogo e acompanhe seu desempenho."
  >
  <link rel="icon" type="image/svg+xml" href="SVG/logo.svg">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="/config.js"></script>
  <script src="js/gamesounds.js"></script>
  <script src="js/mode-logos.js" defer></script>
  <script src="js/settings.js"></script>
  <script src="js/auth-client.js"></script>
  <script src="js/lens.js"></script>
  <script src="js/site-nav.js"></script>
</head>
<body class="page-play" data-lens-context="stats">
  <header class="site-header" id="global-header">
    <div class="site-header__profile">
      <div class="site-header__text">
        <span class="site-header__name">PlayTalk</span>
      </div>
    </div>
  </header>
  <main id="play-container" class="container-screen container-screen--play memory-game-layout" data-page-transition>
    <section class="play-mode-menu" id="playModeMenu">
      <h2>Escolha o modo</h2>
      <div class="play-mode-grid">
        <button class="play-mode-button" type="button" data-play-mode="listening" aria-label="Listening">
          <span class="sr-only">Listening</span>
          <svg class="play-mode-button__icon" viewBox="0 0 64 64" role="img" aria-hidden="true">
            <path d="M32 8c-6.1 0-11 4.9-11 11v26a11 11 0 0 0 22 0V19c0-6.1-4.9-11-11-11Z" fill="currentColor"/>
            <path d="M14 30v5c0 10 8 18 18 18s18-8 18-18v-5" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
            <path d="M32 53v5" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="play-mode-button" type="button" data-play-mode="reading" aria-label="Reading">
          <span class="sr-only">Reading</span>
          <svg class="play-mode-button__icon" viewBox="0 0 64 64" role="img" aria-hidden="true">
            <path d="M14 12h30a6 6 0 0 1 6 6v32H20a6 6 0 0 0-6 6V12Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
            <path d="M20 20h22M20 28h22M20 36h16" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="play-mode-button" type="button" data-play-mode="association" aria-label="Connect">
          <span class="sr-only">Connect</span>
          <svg class="play-mode-button__icon" viewBox="0 0 64 64" role="img" aria-hidden="true">
            <circle cx="32" cy="32" r="18" fill="none" stroke="currentColor" stroke-width="4"/>
            <path d="M14 32h36M32 14v36M20 20c4 4 20 4 24 0M20 44c4-4 20-4 24 0" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="play-mode-button" type="button" data-play-mode="memory" aria-label="Memory">
          <span class="sr-only">Memory</span>
          <svg class="play-mode-button__icon" viewBox="0 0 64 64" role="img" aria-hidden="true">
            <path d="M30 14c-6 0-10 4-10 10v16c0 6 4 10 10 10" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
            <path d="M34 14c6 0 10 4 10 10v16c0 6-4 10-10 10" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
            <path d="M26 22c-2 2-2 6 0 8M26 34c-2 2-2 6 0 8M38 22c2 2 2 6 0 8M38 34c2 2 2 6 0 8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </section>

    <section class="memory-game" id="memoryGame">
      <section class="memory-card" id="memoryCard" aria-live="polite">
        <div class="memory-card__background" id="memoryCardBackground"></div>
        <div class="memory-card__background memory-card__background--fade" id="memoryCardBackgroundFade"></div>
        <div class="memory-card__overlay" id="memoryAccuracy"></div>
        <div class="memory-card__visual" id="memoryVisual">
          <div class="image-ring image-ring--tense"></div>
          <div class="image-ring image-ring--form"></div>
          <div class="memory-card__circle" id="memoryCircle"></div>
          <div class="image-lens image-lens--tense"></div>
          <div class="image-lens image-lens--form"></div>
          <div class="memory-card__lens" id="memoryLens"></div>
        </div>
        <div class="memory-card__prompt" id="memoryPrompt">Speak now</div>
        <div class="memory-stars" id="memoryStars"></div>
      </section>
      <p class="memory-empty" id="memoryEmpty" hidden>Todos os cards estão em seeding.</p>
    </section>

    <section class="connect-game" id="connectGame" hidden>
      <div class="connect-prompt" id="connectPrompt">Ouça e toque na imagem certa.</div>
      <div class="connect-grid" id="connectGrid"></div>
    </section>
  </main>
  <footer class="page-footer">
    <nav id="main-nav">
      <a href="#home" class="nav-item" aria-label="Jornada da Fluência" data-nav-index="0">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img" focusable="false"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
        </span>
        <span class="sr-only">Jornada da Fluência</span>
      </a>
      <a href="#fun" class="nav-item" aria-label="FlashCards" data-nav-index="1">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img" focusable="false"><path d="M19.14 12.94a7.97 7.97 0 0 0 .06-.94 7.97 7.97 0 0 0-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.88 7.88 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.14.55-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.65 8.48a.5.5 0 0 0 .12.64l2.03 1.58a7.97 7.97 0 0 0-.06.94c0 .32.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96c.49.39 1.04.7 1.63.94l.36 2.54a.5.5 0 0 0 .5.42h3.84a.5.5 0 0 0 .5-.42l.36-2.54c.59-.24 1.14-.55 1.63-.94l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64Zm-7.14 1.56a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5Z"/></svg>
        </span>
        <span class="sr-only">FlashCards</span>
      </a>
      <a href="#play" class="nav-item active" aria-label="Modos de Jogo" data-nav-index="2">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img" focusable="false"><path d="M5 21a1 1 0 0 1-1-1V10a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H5Zm6 0a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1h-2Zm6 0a1 1 0 0 1-1-1V13a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1h-2Z"/></svg>
        </span>
        <span class="sr-only">Modos de Jogo</span>
      </a>
    </nav>
  </footer>
  <script src="js/play.js"></script>
</body>
</html>
