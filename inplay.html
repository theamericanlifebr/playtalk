<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <title>PlayTalk | Inplay</title>
  <meta
    name="description"
    content="PlayTalk, o app da fluência, transforma desafios de vocabulário, listening e speaking em uma jornada gamificada para dominar o inglês."
  >
  <link rel="icon" type="image/png" href="selos%20modos%20de%20jogo/logoitalk2.png">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/settings.js"></script>
  <script src="js/lens.js"></script>
  <script src="js/auth.js"></script>
</head>
<body class="page-inplay" data-lens-context="home">
    <header class="site-header" id="global-header">
    <div class="site-header__profile">
      <div class="site-header__avatar-container" id="header-avatar-container">
        <div class="site-header__avatar-ring">
          <img
            src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2296%22%20height%3D%2296%22%20viewBox%3D%220%200%2096%2096%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23c5d7ff%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%237fa8ff%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle%20cx%3D%2248%22%20cy%3D%2248%22%20r%3D%2248%22%20fill%3D%22url(%23g)%22/%3E%3Cpath%20fill%3D%22%23fff%22%20opacity%3D%220.85%22%20d%3D%22M48%2046a14%2014%200%201%200-14-14A14%2014%200%200%200%2048%2046Zm0%207c-12.1%200-22%206.56-22%2014.66V70a24%2024%200%200%200%2044%200v-2.34C70%2059.56%2060.1%2053%2048%2053Z%22/%3E%3C/svg%3E"
            alt="Foto do usuário"
            class="site-header__avatar"
            id="header-avatar"
          >
        </div>
      </div>
      <div class="site-header__text">
        <span class="site-header__name" id="header-username">Jogador</span>
        <span class="site-header__level" id="header-level">Nível 1</span>
      </div>
    </div>
      <div class="site-header__actions">
        <button id="login-btn" class="site-header__button" type="button">Entrar</button>
      </div>
    </header>
  <main id="home-main" class="container-screen container-screen--home" data-page-transition>
    <div id="menu">
      <div id="menu-modes">
        <button type="button" class="menu-mode" data-mode="1">
          <img src="selos%20modos%20de%20jogo/modo1.png" alt="Modo Vocabulary" />
          <span class="menu-mode__label">Vocabulary</span>
        </button>
        <button type="button" class="menu-mode" data-mode="2">
          <img src="selos%20modos%20de%20jogo/modo2.png" alt="Modo Meaning" />
          <span class="menu-mode__label">Meaning</span>
        </button>
        <button type="button" class="menu-mode" data-mode="3">
          <img src="selos%20modos%20de%20jogo/modo3.png" alt="Modo Listening" />
          <span class="menu-mode__label">Listening</span>
        </button>
        <button type="button" class="menu-mode" data-mode="4">
          <img src="selos%20modos%20de%20jogo/modo4.png" alt="Modo Reading" />
          <span class="menu-mode__label">Reading</span>
        </button>
        <button type="button" class="menu-mode" data-mode="5">
          <img src="selos%20modos%20de%20jogo/modo5.png" alt="Modo Translating" />
          <span class="menu-mode__label">Translating</span>
        </button>
        <button type="button" class="menu-mode" data-mode="6">
          <img src="selos%20modos%20de%20jogo/modo6.png" alt="Modo Thinking" />
          <span class="menu-mode__label">Thinking</span>
        </button>
      </div>
    </div>

      <div id="visor" class="container-screen container-screen--visor">
        <!-- conteúdo visual aqui -->
        <div id="score"></div>
        <img id="mode-icon" alt="Mode Icon" style="display:none" />
        <div id="level-finder-level" class="level-finder-level"></div>
        <div id="texto-exibicao"></div>
        <div id="pt-container">
          <textarea id="pt" rows="1" readonly></textarea>
        </div>
      <div id="barra-progresso">
        <div id="barra-preenchida"></div>
      </div>
      <div id="nivel-mensagem"></div>
      <div id="timer"></div>
      <div id="resultado"></div>
      <div id="acertos"></div>
      <div id="mode-buttons">
        <img src="selos%20modos%20de%20jogo/modo1.png" data-mode="1" class="mode-btn" alt="Modo 1" />
        <img src="selos%20modos%20de%20jogo/modo2.png" data-mode="2" class="mode-btn" alt="Modo 2" />
        <img src="selos%20modos%20de%20jogo/modo3.png" data-mode="3" class="mode-btn" alt="Modo 3" />
        <img src="selos%20modos%20de%20jogo/modo4.png" data-mode="4" class="mode-btn" alt="Modo 4" />
        <img src="selos%20modos%20de%20jogo/modo5.png" data-mode="5" class="mode-btn" alt="Modo 5" />
        <img src="selos%20modos%20de%20jogo/modo6.png" data-mode="6" class="mode-btn" alt="Modo 6" />
      </div>
    </div>

    <section id="pre-game-screen" class="game-overlay container-screen container-screen--overlay hidden" aria-hidden="true">
      <div class="game-overlay__panel" role="dialog" aria-labelledby="pre-game-title">
        <img id="pre-game-logo" class="game-overlay__logo" alt="Logo do modo selecionado">
        <h2 id="pre-game-title" class="game-overlay__title">Modo de jogo</h2>
        <div class="pre-game-level">
          <div class="pre-game-level__selector">
            <strong id="pre-game-level" class="pre-game-level__value">Nível 1</strong>
          </div>
        </div>
        <div class="game-overlay__actions">
          <button id="pre-game-start" class="game-overlay__primary" type="button">Play</button>
          <button id="pre-game-level-finder" class="game-overlay__secondary" type="button">Jogar com LevelFinder</button>
        </div>
      </div>
    </section>

    <section id="post-game-screen" class="game-overlay container-screen container-screen--overlay hidden" aria-hidden="true">
      <div class="game-overlay__panel" role="dialog" aria-labelledby="post-game-title">
        <h2 id="post-game-title" class="game-overlay__title game-overlay__title--hidden">Resumo da rodada</h2>
        <img id="post-game-medal" class="game-overlay__medal" alt="Medalha da rodada">
        <p id="post-game-medal-label" class="game-overlay__subtitle game-overlay__medal-label"></p>
        <p id="post-game-level-status" class="game-overlay__subtitle"></p>
        <dl class="post-game-stats">
          <div class="post-game-stats__item">
            <dt>Precisão</dt>
            <dd id="post-game-accuracy">0%</dd>
          </div>
          <div class="post-game-stats__item">
            <dt>Caracteres corretos por segundo</dt>
            <dd id="post-game-cps">0</dd>
          </div>
        </dl>
        <div class="game-overlay__actions">
          <button id="post-game-replay" class="game-overlay__primary" type="button">Jogar novamente</button>
          <button id="post-game-menu" class="game-overlay__secondary" type="button">Voltar ao menu</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="page-footer">
    <nav id="main-nav">
      <a
        href="inplay.html"
        id="home-link"
        class="nav-item active"
        aria-label="Inplay"
        data-nav-index="0"
      >
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img" focusable="false"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
        </span>
        <span class="sr-only">Inplay</span>
      </a>
      <a href="fun.html" class="nav-item" aria-label="Opções de jogo" data-nav-index="1">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img" focusable="false"><path d="M19.14 12.94a7.97 7.97 0 0 0 .06-.94 7.97 7.97 0 0 0-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.88 7.88 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.14.55-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.65 8.48a.5.5 0 0 0 .12.64l2.03 1.58a7.97 7.97 0 0 0-.06.94c0 .32.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96c.49.39 1.04.7 1.63.94l.36 2.54a.5.5 0 0 0 .5.42h3.84a.5.5 0 0 0 .5-.42l.36-2.54c.59-.24 1.14-.55 1.63-.94l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64Zm-7.14 1.56a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5Z"/></svg>
        </span>
        <span class="sr-only">Opções de jogo</span>
      </a>
      <a href="play.html" class="nav-item" aria-label="Estatísticas" data-nav-index="2">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img" focusable="false"><path d="M5 21a1 1 0 0 1-1-1V10a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H5Zm6 0a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1h-2Zm6 0a1 1 0 0 1-1-1V13a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1h-2Z"/></svg>
        </span>
        <span class="sr-only">Estatísticas</span>
      </a>
      <a href="ranking.html" class="nav-item" aria-label="Ranking" data-nav-index="3">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48" role="img" focusable="false"><path d="M14 6a2 2 0 0 0-2 2v4H7a2 2 0 0 0-2 2v4a9 9 0 0 0 9 9 9.06 9.06 0 0 0 8 4.3V38h-4a2 2 0 0 0-2 2v4h20v-4a2 2 0 0 0-2-2h-4v-6.7a9.06 9.06 0 0 0 8-4.3 9 9 0 0 0 9-9v-4a2 2 0 0 0-2-2h-5V8a2 2 0 0 0-2-2Zm2 4h16v2a4 4 0 0 0 4 4h5v2a5 5 0 0 1-5 5H16a5 5 0 0 1-5-5v-2h5a4 4 0 0 0 4-4Zm6 18a9.07 9.07 0 0 0 4 0v6h-4Z"/></svg>
        </span>
        <span class="sr-only">Ranking</span>
      </a>
      <a href="custom.html" class="nav-item" aria-label="Social" data-nav-index="4">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img" focusable="false"><path d="M4 4h16a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-4l-4 4-4-4H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z"/></svg>
        </span>
        <span class="sr-only">Social</span>

      <a href="perfil.html" class="nav-item" aria-label="Perfil" data-nav-index="5">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img" focusable="false"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5Zm0 2c-4 0-7 2-7 4.5V21h14v-2.5C19 16 16 14 12 14Z"/></svg>
        </span>
        <span class="sr-only">Perfil</span>
      </a>
    </nav>
  </footer>
  <audio id="somAcerto" src="gamesounds/success.mp3"></audio>
  <audio id="somErro" src="gamesounds/error.mp3"></audio>
  <audio id="somLock" src="gamesounds/lock.wav"></audio>
  <audio id="somWoosh" src="gamesounds/woosh.mp3"></audio>

  <script src="js/kit-speech.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
