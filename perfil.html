<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <title>Perfil | PlayTalk App</title>
  <meta
    name="description"
    content="Informações do usuário PlayTalk e dados da sua conta."
  >
  <link rel="icon" type="image/svg+xml" href="SVG/logo.svg">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/settings.js"></script>
  <script src="js/lens.js"></script>
  <script src="js/auth.js"></script>
</head>
<body class="page-profile" data-lens-context="profile">
  <header class="site-header" id="global-header">
    <div class="site-header__profile">
      <div class="site-header__avatar-container" id="header-avatar-container">
        <div class="site-header__avatar-ring">
          <img
            src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2296%22%20height%3D%2296%22%20viewBox%3D%220%200%2096%2096%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23c5d7ff%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%237fa8ff%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle%20cx%3D%2248%22%20cy%3D%2248%22%20r%3D%2248%22%20fill%3D%22url(%23g)%22/%3E%3Cpath%20fill%3D%22%23fff%22%20opacity%3D%220.85%22%20d%3D%22M48%2046a14%2014%200%201%200-14-14A14%2014%200%200%200%2048%2046Zm0%207c-12.1%200-22%206.56-22%2014.66V70a24%2024%200%200%200%2044%200v-2.34C70%2059.56%2060.1%2053%2048%2053Z%22/%3E%3C/svg%3E"
            alt="Foto do usuário"
            class="site-header__avatar"
            id="header-avatar"
          >
        </div>
      </div>
      <div class="site-header__text">
        <span class="site-header__name" id="header-username">Jogador</span>
        <span class="site-header__level" id="header-level">Nível 1</span>
      </div>
    </div>
    <div class="site-header__actions">
      <button id="login-btn" class="site-header__button" type="button">Entrar</button>
    </div>
  </header>
  <main id="profile-container" class="container-screen container-screen--profile" data-page-transition>
    <h1>Usuário</h1>
    <form class="profile-form" autocomplete="on">
      <div class="profile-field">
        <label for="profile-name">Nome</label>
        <div class="holo-input-wrapper">
          <input type="text" id="profile-name" name="profile-name" placeholder="Digite seu nome" class="holo-input">
          <span class="holo-input__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img" focusable="false"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5Zm0 2c-4 0-7 2.75-7 5v1h14v-1c0-2.25-3-5-7-5Z"/></svg>
          </span>
        </div>
      </div>
      <div class="profile-photo">
        <div
          id="profile-photo-preview"
          class="profile-photo-preview"
          role="img"
          aria-live="polite"
        >
          <div class="profile-photo-preview__content">
            <img
              id="profile-photo-image"
              class="profile-photo-preview__image"
              alt="Foto do usuário"
              hidden
            >
            <span id="profile-photo-placeholder" class="profile-photo-preview__placeholder">
              Adicione uma foto
            </span>
            <span id="profile-photo-status" class="profile-photo-preview__status" aria-live="polite"></span>
          </div>
        </div>
        <label for="profile-photo" class="profile-upload-label playtalk-cta playtalk-cta--wide">
          <span class="playtalk-cta__inner">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" focusable="false">
              <path d="M21 6h-3.586l-1.707-1.707A1 1 0 0 0 15 4h-4a1 1 0 0 0-.707.293L8.586 6H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1Zm-6 10a4 4 0 1 1 4-4 4 4 0 0 1-4 4Zm0-2a2 2 0 1 0-2-2 2 2 0 0 0 2 2Z" />
            </svg>
            <span>Carregar foto</span>
          </span>
          <input type="file" id="profile-photo" name="profile-photo" accept=".jpg,.jpeg,.png,.gif,.webp">
        </label>
        <button type="button" id="profile-photo-publish" class="profile-publish-button playtalk-cta" disabled>
          <span class="playtalk-cta__inner">
            <svg aria-hidden="true" fill="currentColor" viewBox="0 0 20 20" role="img" focusable="false">
              <path
                clip-rule="evenodd"
                d="M2.293 9.293a1 1 0 0 1 1.414 0L9 14.586l7.293-7.293a1 1 0 1 1 1.414 1.414l-8 8a1 1 0 0 1-1.414 0l-5-5a1 1 0 0 1 0-1.414Z"
                fill-rule="evenodd"
              ></path>
            </svg>
            <span>Publicar foto</span>
          </span>
        </button>
      </div>
      <div class="profile-field">
        <label for="profile-username">Nome de usuário</label>
        <div class="holo-input-wrapper">
          <input type="text" id="profile-username" name="profile-username" class="holo-input" readonly>
          <span class="holo-input__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img" focusable="false"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5Zm0 2c-4 0-7 2.75-7 5v1h14v-1c0-2.25-3-5-7-5Z"/></svg>
          </span>
        </div>
      </div>
      <div class="profile-share">
        <label class="profile-share-toggle" for="profile-share-results">
          <input type="checkbox" id="profile-share-results" name="profile-share-results">
          Compartilhar resultados
        </label>
        <p class="profile-share-description">Ao compartilhar, seu nível e desempenho poderão aparecer nos rankings públicos e no seu perfil.</p>
      </div>
    </form>
    <div class="profile-actions">
      <button
        type="button"
        id="profile-logout-btn"
        class="logout-button logout-button--primary playtalk-cta"
        data-role="logout"
      >
        <span class="playtalk-cta__inner">
          <svg aria-hidden="true" fill="currentColor" viewBox="0 0 20 20" role="img" focusable="false">
            <path
              clip-rule="evenodd"
              d="M3 4a2 2 0 0 1 2-2h5a2 2 0 0 1 2 2v4h-2V4H5v12h5v-4h2v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4Zm11.293 1.293a1 1 0 0 1 1.414 0l3 3a1 1 0 0 1 0 1.414l-3 3a1 1 0 1 1-1.414-1.414L15.586 11H9a1 1 0 1 1 0-2h6.586l-1.293-1.293a1 1 0 0 1 0-1.414Z"
              fill-rule="evenodd"
            ></path>
          </svg>
          <span>Encerrar sessão</span>
        </span>
      </button>
    </div>
  </main>
  <footer class="page-footer">
    <nav id="main-nav">
      <a href="inplay.html" class="nav-item" aria-label="Inplay" data-nav-index="0">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img" focusable="false"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
        </span>
        <span class="sr-only">Inplay</span>
      </a>
      <a href="fun.html" class="nav-item" aria-label="Opções" data-nav-index="1">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img" focusable="false"><path d="M19.14 12.94a7.97 7.97 0 0 0 .06-.94 7.97 7.97 0 0 0-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.88 7.88 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.14.55-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.65 8.48a.5.5 0 0 0 .12.64l2.03 1.58a7.97 7.97 0 0 0-.06.94c0 .32.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96c.49.39 1.04.7 1.63.94l.36 2.54a.5.5 0 0 0 .5.42h3.84a.5.5 0 0 0 .5-.42l.36-2.54c.59-.24 1.14-.55 1.63-.94l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64Zm-7.14 1.56a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5Z"/></svg>
        </span>
        <span class="sr-only">Opções</span>
      </a>
      <a href="play.html" class="nav-item" aria-label="Estatísticas" data-nav-index="2">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img" focusable="false"><path d="M5 21a1 1 0 0 1-1-1V10a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H5Zm6 0a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1h-2Zm6 0a1 1 0 0 1-1-1V13a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1h-2Z"/></svg>
        </span>
        <span class="sr-only">Estatísticas</span>
      </a>
      <a href="ranking.html" class="nav-item" aria-label="Ranking" data-nav-index="3">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48" role="img" focusable="false"><path d="M14 6a2 2 0 0 0-2 2v4H7a2 2 0 0 0-2 2v4a9 9 0 0 0 9 9 9.06 9.06 0 0 0 8 4.3V38h-4a2 2 0 0 0-2 2v4h20v-4a2 2 0 0 0-2-2h-4v-6.7a9.06 9.06 0 0 0 8-4.3 9 9 0 0 0 9-9v-4a2 2 0 0 0-2-2h-5V8a2 2 0 0 0-2-2Zm2 4h16v2a4 4 0 0 0 4 4h5v2a5 5 0 0 1-5 5H16a5 5 0 0 1-5-5v-2h5a4 4 0 0 0 4-4Zm6 18a9.07 9.07 0 0 0 4 0v6h-4Z"/></svg>
        </span>
        <span class="sr-only">Ranking</span>
      </a>
      <a href="perfil.html" class="nav-item active" aria-label="Perfil" aria-current="page" data-nav-index="4">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img" focusable="false"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5Zm0 2c-4 0-7 2-7 4.5V21h14v-2.5C19 16 16 14 12 14Z"/></svg>
        </span>
        <span class="sr-only">Perfil</span>
      </a>
    </nav>
  </footer>
  <script src="js/profile.js"></script>
</body>
</html>
