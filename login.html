<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <title>PlayTalk | Login</title>
  <link rel="icon" type="image/svg+xml" href="SVG/logo.svg">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/settings.js"></script>
  <script src="js/auth.js" defer></script>
</head>
<body class="page-login">
  <main class="container-screen container-screen--overlay" aria-label="Tela de login">
    <div id="login-flow" class="login-flow" role="dialog" aria-modal="true" aria-labelledby="login-flow-title">
      <div class="login-flow__panel">
        <img src="SVG/logo.svg" alt="Logo PlayTalk" class="login-flow__logo" width="70" height="70">
        <h1 id="login-flow-title" class="login-flow__title">Bem-vindo</h1>
        <form id="login-flow-form" class="login-flow__form" autocomplete="off" novalidate>
          <div class="login-flow__step login-flow__step--active">
            <label for="login-flow-username">Nome de usuário</label>
            <input
              type="text"
              id="login-flow-username"
              name="login-flow-username"
              maxlength="40"
              autocomplete="username"
              class="holo-input"
              required
            >
            <label for="login-flow-password">Senha</label>
            <input
              type="password"
              id="login-flow-password"
              name="login-flow-password"
              autocomplete="current-password"
              class="holo-input"
              required
            >
            <button type="submit" class="login-flow__submit neo-button">
              <span class="neo-button__shadow"></span>
              <span class="neo-button__edge"></span>
              <span class="neo-button__front">
                <span>Entrar ou cadastrar</span>
                <svg viewBox="0 0 24 24" role="img" focusable="false" class="neo-button__icon" aria-hidden="true"><path d="M5 12a1 1 0 0 1 1-1h9.586l-3.293-3.293a1 1 0 0 1 1.414-1.414l5 5a1 1 0 0 1 0 1.414l-5 5a1 1 0 1 1-1.414-1.414L15.586 13H6a1 1 0 0 1-1-1Z"/></svg>
              </span>
            </button>
          </div>
          <p id="login-flow-status" class="login-flow__status" role="status" aria-live="polite"></p>
          <p id="login-flow-error" class="login-flow__error" role="alert"></p>
        </form>
      </div>
    </div>
  </main>
</body>
</html>
