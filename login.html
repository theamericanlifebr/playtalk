<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <title>PlayTalk | Login</title>
  <link rel="icon" type="image/svg+xml" href="SVG/logo.svg">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/settings.js"></script>
  <script src="js/auth.js" defer></script>
</head>
<body class="page-login">
  <main class="login-shell" aria-label="Tela de login">
    <div class="login-brand">
      <img src="SVG/logo.svg" alt="Logo PlayTalk" class="login-brand__logo" width="72" height="72">
      <div class="login-brand__text">
        <h1 class="login-brand__title">PlayTalk</h1>
        <p class="login-brand__subtitle">O game da fluência</p>
      </div>
    </div>

    <section id="login-flow" class="login-card" aria-labelledby="login-form-title">
      <h2 id="login-form-title" class="login-card__title">Entre para jogar com sua voz</h2>
      <form id="login-flow-form" class="form" autocomplete="off" novalidate>
        <label id="login-lable" for="login-flow-username">Login</label>
        <input
          class="input"
          type="text"
          id="login-flow-username"
          name="login-flow-username"
          maxlength="40"
          autocomplete="username"
          required
          placeholder="Nome de usuário"
        >

        <input
          class="input"
          type="password"
          id="login-flow-password"
          name="login-flow-password"
          autocomplete="current-password"
          required
          placeholder="Senha"
        >

        <button type="submit" id="btn">Entrar</button>
      </form>
      <p id="login-flow-status" class="login-card__status" role="status" aria-live="polite"></p>
      <p id="login-flow-error" class="login-card__error" role="alert"></p>
    </section>
  </main>
</body>
</html>
